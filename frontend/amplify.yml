version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - "**/*"
  customHeaders:
    - pattern: "**/*"
      headers:
        - key: "Cache-Control"
          value: "max-age=0, no-cache, no-store, must-revalidate"
  redirects:
    - source: '</^[^.]+$|\\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|ttf|map|json)$)([^.]+$)/>'
      target: "/index.html"
      status: "200"
